<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Caveat:wght@400..700&family=Inter:wght@300..700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>
<body>

  <!-- ════════ ENVELOPE INTRO ════════ -->
  <div id="envelope" class="envelope" role="button" tabindex="0" aria-label="Open the invitation">
    <div class="envelope__paper">
      <span class="fold fold--1"></span>
      <span class="fold fold--2"></span>
      <span class="fold fold--3"></span>
      <span class="fold fold--4"></span>
    </div>

    <!-- tulip line art -->
    <svg class="envelope__tulips" viewBox="0 0 320 320" fill="none" stroke="currentColor"
         stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- sweeping stems from the right edge -->
      <path d="M320 36 C 250 62, 175 86, 30 130" />
      <path d="M320 54 C 262 74, 206 92, 152 108" />
      <!-- tulip 1 -->
      <path d="M152 108 C 144 130, 134 148, 120 162" />
      <path d="M120 162 C 101 164, 88 178, 88 197 C 105 201, 121 190, 126 172 Z" />
      <path d="M120 162 C 131 176, 131 195, 120 210 C 106 199, 102 180, 110 166 Z" />
      <path d="M120 166 C 118 180, 116 192, 116 202" />
      <!-- tulip 2 -->
      <path d="M234 82 C 238 116, 241 150, 237 184" />
      <path d="M237 184 C 220 190, 211 207, 216 226 C 233 226, 245 211, 245 192 Z" />
      <path d="M237 184 C 251 193, 257 212, 250 230 C 236 223, 229 206, 233 190 Z" />
      <path d="M236 188 C 235 200, 234 212, 234 222" />
    </svg>

    <button class="envelope__seal" aria-hidden="true" tabindex="-1">
      <svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="2.4"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M16 64 C 38 56, 62 48, 86 38" />
        <path d="M30 58 C 26 50, 28 42, 35 37 C 39 45, 37 53, 30 58 Z" />
        <path d="M44 53 C 40 45, 42 37, 49 32 C 53 40, 51 48, 44 53 Z" />
        <path d="M58 48 C 54 40, 56 32, 63 27 C 67 35, 65 43, 58 48 Z" />
        <path d="M40 61 C 44 67, 52 69, 58 66" />
        <path d="M56 56 C 60 62, 68 64, 74 61" />
      </svg>
    </button>

    <p class="envelope__hint script" id="envelope-hint">Click to open</p>
  </div>

  <!-- ════════ "YOU ARE INVITED" INTERSTITIAL ════════ -->
  <div id="invited" class="invited" aria-hidden="true">
    <svg class="invited__flower invited__flower--top" viewBox="0 0 120 330" fill="none"
         stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- stem grows upward first -->
      <path pathLength="1" style="--d:0s; --dur:1.1s" d="M60 326 C 60 232, 60 138, 60 36" />
      <!-- blossoms, bottom to top -->
      <path pathLength="1" style="--d:0.85s" d="M60 278 C 77 272, 85 257, 78 244 C 63 248, 55 261, 58 276 Z" />
      <path pathLength="1" style="--d:0.95s" d="M60 278 C 43 272, 35 257, 42 244 C 57 248, 65 261, 62 276 Z" />
      <path pathLength="1" style="--d:1.15s" d="M60 226 C 75 221, 82 207, 76 195 C 62 199, 55 211, 58 224 Z" />
      <path pathLength="1" style="--d:1.25s" d="M60 226 C 45 221, 38 207, 44 195 C 58 199, 65 211, 62 224 Z" />
      <path pathLength="1" style="--d:1.45s" d="M60 176 C 73 172, 79 159, 74 148 C 61 152, 55 163, 58 174 Z" />
      <path pathLength="1" style="--d:1.55s" d="M60 176 C 47 172, 41 159, 46 148 C 59 152, 65 163, 62 174 Z" />
      <path pathLength="1" style="--d:1.75s" d="M60 128 C 71 124, 76 113, 72 103 C 61 107, 56 117, 58 126 Z" />
      <path pathLength="1" style="--d:1.85s" d="M60 128 C 49 124, 44 113, 48 103 C 59 107, 64 117, 62 126 Z" />
      <path pathLength="1" style="--d:2.05s" d="M60 84 C 68 80, 71 71, 68 63 C 60 66, 56 74, 58 82 Z" />
      <path pathLength="1" style="--d:2.15s" d="M60 84 C 52 80, 49 71, 52 63 C 60 66, 64 74, 62 82 Z" />
      <path pathLength="1" style="--d:2.3s"  d="M60 48 C 55 41, 55 31, 60 24 C 65 31, 65 41, 60 48 Z" />
    </svg>
    <p class="invited__text" id="invited-text">You are invited!</p>
    <svg class="invited__flower invited__flower--bottom" viewBox="0 0 160 330" fill="none"
         stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <!-- stem grows downward -->
      <path pathLength="1" style="--d:0.3s; --dur:1.1s" d="M76 4 C 74 112, 78 220, 84 326" />
      <!-- leaves -->
      <path pathLength="1" style="--d:1.5s" d="M78 122 C 58 111, 40 112, 26 127 C 45 139, 67 137, 79 126 Z" />
      <path pathLength="1" style="--d:1.7s" d="M80 112 C 96 95, 118 88, 138 94 C 130 113, 105 123, 84 117 Z" />
    </svg>
  </div>

  <!-- ════════ SITE ════════ -->
  <main id="site" class="site" hidden>

    <!-- BANNER -->
    <div class="top-banner">
      <span class="top-banner__icon">✨</span>
      <span>No kids allowed / ممنوع اصطحاب الأطفال</span>
      <span class="top-banner__icon">✨</span>
    </div>

    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero__bg"></div>
      <div class="hero__particles"></div>
      
      <div class="hero__content glass-card reveal">
        <p class="hero__kicker script" id="hero-kicker"></p>
        <h1 class="hero__names serif">
          <span id="name-first"></span>
          <span class="amp serif-italic">&amp;</span>
          <span id="name-second"></span>
        </h1>
        <p class="hero__date label" id="hero-date"></p>
        <button class="btn btn--dark" id="hero-btn">
          <span id="hero-btn-text"></span>
          <span class="btn__arrow">→</span>
        </button>
      </div>

      <p class="hero__scroll label"><span id="hero-scroll-text"></span> ↓</p>
    </section>

    <!-- SAVE THE DATE -->
    <section class="std" id="save-the-date">
      <h2 class="std__title reveal">
        <span class="std__save">SAVE</span>
        <span class="std__the-date"><em class="script">the</em><span>DATE!</span></span>
      </h2>
      <img class="std__illustration reveal" id="std-illustration" src="" alt="Bride and groom illustration" />
      <hr class="std__rule" />
      <p class="std__names label reveal" id="std-names"></p>
      <p class="std__date label reveal" id="std-date"></p>
    </section>

    <!-- VENUE -->
    <section class="venue" id="venue">
      <div class="venue__bg" id="venue-bg"></div>
      <div class="venue__content">
        <h2 class="venue__title serif reveal">
          <span id="venue-title-start"></span>
          <em class="serif-italic" id="venue-title-italic"></em>
          <span id="venue-title-end"></span>
        </h2>
        <dl class="venue__details">
          <div class="reveal"><dt class="label">Venue</dt><dd class="serif" id="venue-name"></dd></div>
          <div class="reveal"><dt class="label">When</dt><dd class="serif" id="venue-when"></dd></div>
          <div class="reveal"><dt class="label">Notice</dt><dd class="serif" id="venue-dress"></dd></div>
        </dl>
        <a class="btn btn--ghost reveal" id="venue-maps" href="#" target="_blank" rel="noopener">
          <span class="label">Open in Maps</span><span class="btn__arrow">↗</span>
        </a>
      </div>
    </section>

    <!-- PROGRAM -->
    <section class="program" id="program">
      <p class="program__kicker script reveal" id="program-kicker"></p>
      <h2 class="program__title serif reveal" id="program-title"></h2>
      <ol class="program__list" id="program-list"></ol>
      <p class="program__closing script reveal" id="program-closing"></p>
    </section>

    <!-- GALLERY -->
    <section class="gallery" id="gallery">
      <h2 class="gallery__title serif reveal" id="gallery-title"></h2>
      <p class="gallery__subtitle reveal" id="gallery-subtitle"></p>
      <div class="gallery__grid" id="gallery-grid"></div>
    </section>

    <!-- COUNTDOWN -->
    <section class="countdown" id="countdown">
      <h2 class="countdown__title serif reveal" id="countdown-title"></h2>
      <div class="countdown__grid">
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-days">0</span><span class="label" id="cd-days-label"></span></div>
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-hours">0</span><span class="label" id="cd-hours-label"></span></div>
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-minutes">0</span><span class="label" id="cd-minutes-label"></span></div>
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-seconds">0</span><span class="label" id="cd-seconds-label"></span></div>
      </div>
      <p class="countdown__closing script reveal" id="countdown-closing"></p>
    </section>

    <!-- MESSAGE -->
    <section class="msg" id="message">
      <hr class="msg__rule" />
      <h2 class="msg__title serif reveal" id="msg-title"></h2>
      <p class="msg__text serif-italic reveal" id="msg-text"></p>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p class="footer__names serif">
        <span id="footer-name-first"></span>
        <span class="amp serif-italic">&amp;</span>
        <span id="footer-name-second"></span>
      </p>
      <p class="footer__date label" id="footer-date"></p>
      <p class="footer__credit label">
        <span id="footer-credit-label"></span>
        <a id="footer-credit-name" href="#"></a>
      </p>
      <div class="footer__social" id="footer-social"></div>
    </footer>
  </main>

  <!-- MUSIC BUTTON -->
  <button id="music-btn" class="music-btn" hidden aria-label="Play / pause music">
    <svg class="music-btn__play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg class="music-btn__pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <audio id="music" loop preload="none"></audio>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
