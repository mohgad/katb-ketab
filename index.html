<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Caveat:wght@400..700&family=Pinyon+Script&family=Parisienne&family=Inter:wght@300..700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=5" />
</head>

<body>

  <!-- ════════ ENVELOPE INTRO (full-screen, 3D flap opening) ════════ -->
  <div id="envelope" class="envelope" role="button" tabindex="0" aria-label="Open the invitation">
    <!-- the envelope paper (pocket) -->
    <div class="envelope__paper" aria-hidden="true"></div>

    <!-- text printed on the envelope -->
    <div class="envelope__content">
      <p class="envelope__bismillah" dir="rtl" id="envelope-bismillah">بسم الله الرحمن الرحيم</p>
      <p class="envelope__title" id="envelope-title">You're invited</p>
    </div>

    <!-- darkness inside the pocket + shadow cast by the flap -->
    <div class="envelope__pocket" aria-hidden="true"></div>
    <div class="envelope__shadow" aria-hidden="true"><div class="envelope__shadow-shape"></div></div>

    <!-- the 3D flap (swings up toward the viewer and off the top) -->
    <div class="envelope__flap" id="envelope-flap" aria-hidden="true">
      <div class="envelope__flap-face envelope__flap-face--front"></div>
      <div class="envelope__flap-face envelope__flap-face--back"></div>
      <div class="envelope__seal" id="envelope-seal">
        <img src="img/wax-seal.png" alt="" class="envelope__seal-img" />
      </div>
    </div>

    <!-- hint -->
    <p class="envelope__cta" id="envelope-hint">TAP TO OPEN</p>
  </div>

  <!-- ════════ SITE ════════ -->
  <main id="site" class="site" hidden>

    <!-- BANNER -->
    <div class="top-banner">
      <span class="top-banner__icon">✨</span>
      <span>No kids allowed / ممنوع اصطحاب الأطفال</span>
      <span class="top-banner__icon">✨</span>
    </div>

    <!-- HERO — animated scene: bride & groom holding hands in the sahn of Mohamed Ali Mosque -->
    <section class="hero" id="hero">
      <div class="hero__bg-fill" id="hero-bg-fill" aria-hidden="true"></div>
      <div class="hero__bg" id="hero-bg"></div>
      <div class="hero__glow" aria-hidden="true"></div>

      <!-- birds crossing the sky -->
      <div class="hero__birds" aria-hidden="true">
        <svg class="bird bird--1" viewBox="0 0 24 10"><path d="M1 6 Q6 0 12 6 Q18 0 23 6" /></svg>
        <svg class="bird bird--2" viewBox="0 0 24 10"><path d="M1 6 Q6 0 12 6 Q18 0 23 6" /></svg>
        <svg class="bird bird--3" viewBox="0 0 24 10"><path d="M1 6 Q6 0 12 6 Q18 0 23 6" /></svg>
      </div>

      <div class="hero__scrim" aria-hidden="true"></div>

      <div class="hero__text">
        <p class="hero__kicker" id="hero-kicker"></p>
        <h1 class="hero__names">
          <span id="name-first"></span>
          <span class="amp">&amp;</span>
          <span id="name-second"></span>
        </h1>
        <p class="hero__sub" id="hero-sub"></p>
        <p class="hero__date" id="hero-date"></p>
      </div>

      <!-- the couple (seen from behind, walking in hand in hand) -->
      <div class="couple-wrap" aria-hidden="true">
        <svg class="couple" viewBox="0 0 400 640">
          <defs>
            <linearGradient id="gSuit" x1="0" x2="1">
              <stop offset="0" stop-color="#7d8490" />
              <stop offset=".55" stop-color="#606672" />
              <stop offset="1" stop-color="#4b505a" />
            </linearGradient>
            <linearGradient id="gSleeve" x1="0" x2="1">
              <stop offset="0" stop-color="#6c737e" />
              <stop offset="1" stop-color="#4f545e" />
            </linearGradient>
            <linearGradient id="gTrouser" x1="0" x2="1">
              <stop offset="0" stop-color="#595e68" />
              <stop offset="1" stop-color="#3f434b" />
            </linearGradient>
            <linearGradient id="gHair" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#3b2b22" />
              <stop offset="1" stop-color="#1f1714" />
            </linearGradient>
            <linearGradient id="gSkin" x1="0" x2="1">
              <stop offset="0" stop-color="#d6a687" />
              <stop offset="1" stop-color="#b98567" />
            </linearGradient>
            <linearGradient id="gHijab" x1="0" x2="1">
              <stop offset="0" stop-color="#fffdf9" />
              <stop offset=".6" stop-color="#f3ede4" />
              <stop offset="1" stop-color="#e2d8ca" />
            </linearGradient>
            <linearGradient id="gGown" x1="0" x2="1">
              <stop offset="0" stop-color="#fffefb" />
              <stop offset=".55" stop-color="#f4efe7" />
              <stop offset="1" stop-color="#ddd2c3" />
            </linearGradient>
            <linearGradient id="gGownV" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#fff" stop-opacity="0" />
              <stop offset="1" stop-color="#d9cdbd" stop-opacity=".55" />
            </linearGradient>
            <linearGradient id="gVeil" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffffff" stop-opacity=".78" />
              <stop offset=".5" stop-color="#ffffff" stop-opacity=".5" />
              <stop offset="1" stop-color="#fffaf2" stop-opacity=".62" />
            </linearGradient>
            <radialGradient id="gShadow">
              <stop offset="0" stop-color="#4a3622" stop-opacity=".38" />
              <stop offset="1" stop-color="#4a3622" stop-opacity="0" />
            </radialGradient>
          </defs>

          <!-- ground shadow -->
          <ellipse cx="190" cy="604" rx="175" ry="22" fill="url(#gShadow)" />

          <g class="walker">
            <!-- ═══ GROOM ═══ -->
            <g class="groom">
              <g class="leg leg--l">
                <path d="M234 318 L266 318 L263 572 Q251 576 239 572 Z" fill="url(#gTrouser)" />
                <path d="M236 568 Q250 564 265 568 L266 583 Q250 590 235 583 Z" fill="#221c19" />
              </g>
              <g class="leg leg--r">
                <path d="M270 318 L304 318 L299 572 Q287 576 275 572 Z" fill="url(#gTrouser)" />
                <path d="M272 568 Q286 564 300 568 L301 583 Q286 590 271 583 Z" fill="#221c19" />
              </g>

              <!-- right arm (hangs relaxed) -->
              <path d="M310 134 Q327 140 328 172 L332 296 Q322 300 313 297 L309 184 Z" fill="url(#gSleeve)" />
              <path d="M313 294 L332 292 L332 299 L313 301 Z" fill="#f2eee8" />
              <path d="M314 300 Q322 296 332 299 Q335 314 326 323 Q317 321 314 311 Z" fill="url(#gSkin)" />

              <!-- jacket -->
              <path d="M216 136 Q222 124 248 116 Q268 121 288 116 Q314 124 320 136 L316 200 Q314 236 310 256 Q306 272 310 334 L226 334 Q230 272 226 256 Q222 236 220 200 Z" fill="url(#gSuit)" />
              <path d="M268 126 L268 334" stroke="#3f444d" stroke-opacity=".35" stroke-width="1.2" />
              <path d="M268 292 L268 334" stroke="#353941" stroke-width="1.6" />
              <path d="M226 256 Q268 266 310 256" stroke="#3f444d" stroke-opacity=".25" stroke-width="1.2" fill="none" />
              <path d="M300 128 Q318 136 316 200 Q313 240 309 258 Q306 280 310 334 L296 334 Q296 250 300 128 Z" fill="#000" fill-opacity=".08" />
              <!-- collar -->
              <path d="M246 116 Q268 110 290 116 L288 125 Q268 119 248 125 Z" fill="#4d525c" />

              <!-- left arm (reaching to her hand) -->
              <path d="M226 134 Q212 140 210 172 L200 290 Q209 296 218 293 L227 192 Z" fill="url(#gSleeve)" />
              <path d="M200 288 L218 291 L217 297 L199 294 Z" fill="#f2eee8" />

              <!-- head -->
              <g class="groom__head">
                <path d="M256 88 L280 88 L282 114 Q268 110 254 114 Z" fill="#bf8b6c" />
                <path d="M252 111 Q268 107 284 111 L284 117 Q268 113 252 117 Z" fill="#f4f1ec" />
                <ellipse cx="245.5" cy="70" rx="4" ry="7.5" fill="#c9957a" />
                <ellipse cx="290.5" cy="70" rx="4" ry="7.5" fill="#bd896c" />
                <path d="M245 66 Q244 37 268 36 Q292 37 291 66 Q291 84 282 92 Q268 97 254 92 Q245 84 245 66 Z" fill="url(#gHair)" />
                <path d="M254 90 Q268 95 282 90 L282 94 Q268 99 254 94 Z" fill="#6b4f3f" fill-opacity=".5" />
              </g>
            </g>

            <!-- ═══ BRIDE ═══ -->
            <g class="bride">
              <!-- gown skirt + train -->
              <g class="skirt">
                <path d="M130 262 L174 262 Q196 360 216 470 Q226 530 232 566 Q238 602 212 613 Q150 628 70 615 Q38 606 50 572 Q72 470 104 370 Q116 310 130 262 Z" fill="url(#gGown)" />
                <path d="M130 262 L174 262 Q196 360 216 470 Q226 530 232 566 Q238 602 212 613 Q150 628 70 615 Q38 606 50 572 Q72 470 104 370 Q116 310 130 262 Z" fill="url(#gGownV)" />
                <g fill="none" stroke="#d8cdbd" stroke-width="1.3" stroke-linecap="round" opacity=".8">
                  <path d="M150 272 Q146 420 124 612" />
                  <path d="M163 272 Q178 420 198 608" />
                  <path d="M140 270 Q122 400 86 604" />
                  <path d="M170 300 Q200 440 220 590" opacity=".6" />
                </g>
                <path d="M52 588 Q140 612 230 590" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round" opacity=".9" />
              </g>

              <!-- bodice (mostly under the hijab) -->
              <path d="M128 200 L176 200 Q178 236 174 264 L130 264 Q126 236 128 200 Z" fill="#f6f1e9" />
              <path d="M130 262 Q152 268 174 262" fill="none" stroke="#e0d5c6" stroke-width="2" />

              <!-- sleeves -->
              <path d="M112 150 Q97 160 95 210 Q91 262 98 292 Q108 298 117 292 Q119 250 125 205 Z" fill="url(#gGown)" />
              <path d="M97 288 Q107 294 117 289" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" />
              <path d="M188 150 Q203 160 205 210 Q207 262 201 294 Q193 298 186 293 Q186 250 178 205 Z" fill="url(#gGown)" />

              <!-- khimar / hijab over head, shoulders and back -->
              <g class="bride__head">
                <path d="M124 82 Q124 110 120 126 Q103 140 99 168 Q97 196 103 222 Q126 233 150 228 Q174 235 197 222 Q203 196 201 168 Q197 140 180 126 Q176 110 176 82 Q176 53 150 53 Q124 53 124 82 Z" fill="url(#gHijab)" />
                <path d="M122 118 Q150 128 178 118 Q181 124 180 128 Q150 138 120 128 Q119 124 122 118 Z" fill="#d9cdbd" fill-opacity=".35" />
                <ellipse cx="150" cy="75" rx="21" ry="19" fill="#ffffff" fill-opacity=".55" />
                <g fill="none" stroke="#d9cfc1" stroke-width="1.2" stroke-linecap="round" opacity=".85">
                  <path d="M136 102 Q131 150 120 216" />
                  <path d="M165 102 Q171 150 181 218" />
                  <path d="M150 112 Q151 170 150 228" opacity=".6" />
                  <path d="M124 124 Q150 134 178 124" opacity=".6" />
                </g>
                <path d="M103 222 Q126 233 150 228 Q174 235 197 222" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="1 4.5" stroke-linecap="round" />
              </g>
            </g>

            <!-- clasped hands -->
            <g class="hands">
              <path d="M195 293 Q205 294 208 305 Q205 316 196 314 Q191 304 195 293 Z" fill="#dcae92" />
              <path d="M200 291 Q212 293 213 305 Q210 315 201 315 Q197 302 200 291 Z" fill="#c38f70" />
              <path d="M202 300 Q207 303 211 302 M202 305 Q207 308 211 307" stroke="#9c6a4f" stroke-width=".8" fill="none" opacity=".6" />
            </g>

            <!-- long sheer veil (drawn over her back), flowing in the breeze -->
            <g class="veil">
              <path fill="url(#gVeil)" stroke="#ffffff" stroke-opacity=".7" stroke-width="1"
                d="M141 60 Q150 54 159 60 Q175 160 185 270 Q195 380 211 480 Q225 570 250 630 Q140 646 26 634 Q2 560 26 470 Q52 360 88 250 Q118 140 141 60 Z">
                <animate attributeName="d" dur="7s" repeatCount="indefinite" calcMode="spline"
                  keySplines=".45 0 .55 1; .45 0 .55 1"
                  values="M141 60 Q150 54 159 60 Q175 160 185 270 Q195 380 211 480 Q225 570 250 630 Q140 646 26 634 Q2 560 26 470 Q52 360 88 250 Q118 140 141 60 Z;
                          M141 60 Q150 54 159 60 Q176 160 186 270 Q197 380 214 480 Q230 570 258 626 Q136 648 12 628 Q-14 548 12 458 Q40 350 80 244 Q114 136 141 60 Z;
                          M141 60 Q150 54 159 60 Q175 160 185 270 Q195 380 211 480 Q225 570 250 630 Q140 646 26 634 Q2 560 26 470 Q52 360 88 250 Q118 140 141 60 Z" />
              </path>
              <path fill="#ffffff" fill-opacity=".22"
                d="M143 64 Q130 150 104 256 Q74 370 52 478 Q36 560 44 626 Q70 630 96 630 Q90 540 104 460 Q124 350 138 250 Q148 150 143 64 Z">
                <animate attributeName="d" dur="7s" begin="-1.2s" repeatCount="indefinite" calcMode="spline"
                  keySplines=".45 0 .55 1; .45 0 .55 1"
                  values="M143 64 Q130 150 104 256 Q74 370 52 478 Q36 560 44 626 Q70 630 96 630 Q90 540 104 460 Q124 350 138 250 Q148 150 143 64 Z;
                          M143 64 Q126 150 96 256 Q62 370 38 478 Q20 560 28 622 Q56 628 84 628 Q80 540 96 460 Q118 350 136 250 Q148 150 143 64 Z;
                          M143 64 Q130 150 104 256 Q74 370 52 478 Q36 560 44 626 Q70 630 96 630 Q90 540 104 460 Q124 350 138 250 Q148 150 143 64 Z" />
              </path>
              <circle cx="150" cy="60" r="3.2" fill="#d8b56a" />
              <circle cx="143" cy="62" r="1.8" fill="#f5e6c4" />
              <circle cx="157" cy="62" r="1.8" fill="#f5e6c4" />
            </g>
          </g>
        </svg>
      </div>

      <!-- floating petals -->
      <div class="hero__petals" id="hero-petals" aria-hidden="true"></div>

      <p class="hero__scroll"><span class="hero__scroll-arrow">↓</span><span id="hero-scroll-text"></span></p>
    </section>

    <!-- SAVE THE DATE -->
    <section class="std" id="save-the-date">
      <h2 class="std__title reveal">
        <span class="std__save">SAVE</span>
        <span class="std__the-date"><em class="script">the</em><span>DATE!</span></span>
      </h2>
      <!-- <img class="std__illustration reveal" id="std-illustration" src="" alt="Bride and groom illustration" /> -->
      <hr class="std__rule" />
      <p class="std__names label reveal" id="std-names"></p>
      <p class="std__date label reveal" id="std-date"></p>
    </section>

    <!-- VENUE -->
    <section class="venue" id="venue">
      <div class="venue__bg" id="venue-bg"></div>
      <div class="venue__content">
        <h2 class="venue__title serif reveal">
          <span id="venue-title-start"></span>
          <em class="serif-italic" id="venue-title-italic"></em>
          <span id="venue-title-end"></span>
        </h2>
        <dl class="venue__details">
          <div class="reveal">
            <dt class="label">Venue</dt>
            <dd class="serif" id="venue-name"></dd>
          </div>
          <div class="reveal">
            <dt class="label">When</dt>
            <dd class="serif" id="venue-when"></dd>
          </div>
          <div class="reveal">
            <dt class="label">Notice</dt>
            <dd class="serif" id="venue-dress"></dd>
          </div>
        </dl>
        <a class="btn btn--ghost reveal" id="venue-maps" href="#" target="_blank" rel="noopener">
          <span class="label">Open in Maps</span><span class="btn__arrow">↗</span>
        </a>
      </div>
    </section>

    <!-- PROGRAM -->
    <section class="program" id="program">
      <p class="program__kicker script reveal" id="program-kicker"></p>
      <h2 class="program__title serif reveal" id="program-title"></h2>
      <ol class="program__list" id="program-list"></ol>
      <p class="program__closing script reveal" id="program-closing"></p>
    </section>

    <!-- GALLERY -->
    <section class="gallery" id="gallery">
      <h2 class="gallery__title serif reveal" id="gallery-title"></h2>
      <p class="gallery__subtitle reveal" id="gallery-subtitle"></p>
      <div class="gallery__grid" id="gallery-grid"></div>
    </section>

    <!-- COUNTDOWN -->
    <section class="countdown" id="countdown">
      <h2 class="countdown__title reveal" id="countdown-title"></h2>

      <!-- vintage clock with a little bouquet — its hands show the real time -->
      <svg class="countdown__clock reveal" viewBox="0 0 160 170" aria-hidden="true">
        <defs>
          <radialGradient id="gClockFace" cx=".45" cy=".4" r=".7">
            <stop offset="0" stop-color="#fffdf7" />
            <stop offset="1" stop-color="#efe5d2" />
          </radialGradient>
          <linearGradient id="gClockRim" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e6cf9a" />
            <stop offset=".5" stop-color="#c9a86a" />
            <stop offset="1" stop-color="#a88649" />
          </linearGradient>
        </defs>
        <circle cx="86" cy="12" r="6" fill="none" stroke="url(#gClockRim)" stroke-width="3" />
        <rect x="81" y="16" width="10" height="8" rx="2" fill="url(#gClockRim)" />
        <circle cx="86" cy="70" r="47" fill="url(#gClockRim)" />
        <circle cx="86" cy="70" r="41" fill="url(#gClockFace)" stroke="#b8975a" stroke-width="1" />
        <circle cx="86" cy="70" r="35" fill="none" stroke="#d9c49a" stroke-width=".8" />
        <g font-family="Cinzel, serif" font-size="7.5" fill="#9a7a45" text-anchor="middle">
          <text x="86" y="41">XII</text><text x="115" y="73">III</text>
          <text x="86" y="104">VI</text><text x="57" y="73">IX</text>
        </g>
        <g fill="#b8975a">
          <circle cx="101" cy="44" r="1.2" /><circle cx="112" cy="55" r="1.2" />
          <circle cx="112" cy="85" r="1.2" /><circle cx="101" cy="96" r="1.2" />
          <circle cx="71" cy="96" r="1.2" /><circle cx="60" cy="85" r="1.2" />
          <circle cx="60" cy="55" r="1.2" /><circle cx="71" cy="44" r="1.2" />
        </g>
        <g stroke="#5a4428" stroke-linecap="round">
          <line id="clock-hour" x1="86" y1="70" x2="86" y2="50" stroke-width="2.4" />
          <line id="clock-min" x1="86" y1="70" x2="86" y2="40" stroke-width="1.5" />
        </g>
        <circle cx="86" cy="70" r="2.6" fill="#a88649" />
        <!-- bouquet at the bottom left -->
        <g transform="translate(-12 -20) scale(1.2)"><g class="countdown__flowers">
          <path d="M44 128 Q30 118 22 104 Q36 108 46 120 Z" fill="#9aa585" />
          <path d="M52 132 Q46 146 34 150 Q36 136 48 128 Z" fill="#8a9676" />
          <path d="M70 124 Q84 134 98 134 Q88 122 72 118 Z" fill="#a3ad8e" />
          <path d="M40 112 Q34 96 38 84 Q48 96 46 110 Z" fill="#b1b99c" />
          <g transform="translate(52 114)">
            <g fill="#fbf7ef" stroke="#e2d6c1" stroke-width=".8">
              <ellipse rx="6" ry="11" transform="rotate(0)" /><ellipse rx="6" ry="11" transform="rotate(72)" />
              <ellipse rx="6" ry="11" transform="rotate(144)" /><ellipse rx="6" ry="11" transform="rotate(216)" />
              <ellipse rx="6" ry="11" transform="rotate(288)" />
            </g>
            <circle r="3.6" fill="#d9b66f" />
          </g>
          <g transform="translate(72 126) scale(.72)">
            <g fill="#f6ede0" stroke="#e2d0b8" stroke-width=".9">
              <ellipse rx="6" ry="11" transform="rotate(20)" /><ellipse rx="6" ry="11" transform="rotate(92)" />
              <ellipse rx="6" ry="11" transform="rotate(164)" /><ellipse rx="6" ry="11" transform="rotate(236)" />
              <ellipse rx="6" ry="11" transform="rotate(308)" />
            </g>
            <circle r="3.6" fill="#cfa962" />
          </g>
          <g transform="translate(34 128) scale(.55)">
            <g fill="#f3e6e0" stroke="#e0c9bf" stroke-width="1">
              <ellipse rx="6" ry="11" transform="rotate(10)" /><ellipse rx="6" ry="11" transform="rotate(82)" />
              <ellipse rx="6" ry="11" transform="rotate(154)" /><ellipse rx="6" ry="11" transform="rotate(226)" />
              <ellipse rx="6" ry="11" transform="rotate(298)" />
            </g>
            <circle r="3.6" fill="#d9b66f" />
          </g>
          <g fill="#e9dcc3"><circle cx="86" cy="132" r="2" /><circle cx="91" cy="129" r="1.6" /><circle cx="28" cy="112" r="1.8" /></g>
        </g></g>
      </svg>

      <p class="countdown__text reveal" id="countdown-text"></p>

      <div class="countdown__grid reveal">
        <div class="countdown__unit"><span class="countdown__num" id="cd-days">00</span><span class="countdown__label" id="cd-days-label"></span></div>
        <div class="countdown__unit"><span class="countdown__num" id="cd-hours">00</span><span class="countdown__label" id="cd-hours-label"></span></div>
        <div class="countdown__unit"><span class="countdown__num" id="cd-minutes">00</span><span class="countdown__label" id="cd-minutes-label"></span></div>
        <div class="countdown__unit"><span class="countdown__num" id="cd-seconds">00</span><span class="countdown__label" id="cd-seconds-label"></span></div>
      </div>
      <p class="countdown__closing reveal" id="countdown-closing"></p>
    </section>

    <!-- MESSAGE -->
    <section class="msg" id="message">
      <hr class="msg__rule" />
      <h2 class="msg__title serif reveal" id="msg-title"></h2>
      <p class="msg__text serif-italic reveal" id="msg-text"></p>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p class="footer__names serif">
        <span id="footer-name-first"></span>
        <span class="amp serif-italic">&amp;</span>
        <span id="footer-name-second"></span>
      </p>
      <p class="footer__date label" id="footer-date"></p>
      <p class="footer__credit label">
        <span id="footer-credit-label"></span>
        <a id="footer-credit-name" href="#"></a>
      </p>
      <div class="footer__social" id="footer-social"></div>
    </footer>
  </main>

  <!-- MUSIC BUTTON -->
  <button id="music-btn" class="music-btn" hidden aria-label="Play / pause music">
    <svg class="music-btn__play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M8 5v14l11-7z" />
    </svg>
    <svg class="music-btn__pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
    </svg>
  </button>
  <audio id="music" loop preload="none"></audio>

  <script src="config.js?v=5"></script>
  <script src="js/main.js?v=5"></script>
</body>

</html>
