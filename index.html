<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Caveat:wght@400..700&family=Inter:wght@300..700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=3" />
</head>

<body>

  <!-- ════════ ENVELOPE INTRO ════════ -->
  <div id="envelope" class="envelope" role="button" tabindex="0" aria-label="Open the invitation">
    <!-- Soft floating petals canvas -->
    <canvas id="petals-canvas" class="envelope__petals-canvas" aria-hidden="true"></canvas>

    <!-- Dried botanical decorations (top-right corner) -->
    <div class="envelope__botanicals" aria-hidden="true">
      <svg class="envelope__branch" viewBox="0 0 200 320" fill="none" stroke="currentColor" stroke-width="1.6"
        stroke-linecap="round" stroke-linejoin="round">
        <!-- main stem arching from top-right -->
        <path d="M180 10 C 160 50, 130 100, 90 160 C 60 210, 40 260, 35 310" />
        <!-- leaves along the stem -->
        <path d="M160 35 C 170 45, 175 60, 168 72 C 158 62, 155 47, 160 35 Z" />
        <path d="M145 65 C 132 58, 122 65, 118 78 C 130 82, 140 75, 145 65 Z" />
        <path d="M130 100 C 142 105, 148 118, 142 130 C 130 125, 125 112, 130 100 Z" />
        <path d="M115 130 C 102 125, 92 132, 88 145 C 100 148, 110 140, 115 130 Z" />
        <path d="M100 160 C 110 168, 112 182, 104 192 C 94 184, 92 170, 100 160 Z" />
        <path d="M82 195 C 70 190, 60 198, 58 212 C 70 214, 78 205, 82 195 Z" />
        <path d="M65 235 C 74 242, 75 256, 68 266 C 58 258, 56 244, 65 235 Z" />
        <!-- wispy secondary branches -->
        <path d="M155 50 C 175 55, 190 70, 192 88" />
        <path d="M110 140 C 88 135, 70 142, 60 158" />
      </svg>
    </div>

    <!-- The physical cream envelope -->
    <div class="envelope__body">
      <!-- Inner card (slides out on open) -->
      <div class="envelope__card" id="envelope-card">
        <div class="envelope__card-border">
          <p class="envelope__bismillah" dir="rtl">بسم الله الرحمن الرحيم</p>
          <div class="envelope__card-ornament">✦</div>
        </div>
      </div>

      <!-- Envelope back -->
      <div class="envelope__back"></div>

      <!-- Flap (triangular top) -->
      <div class="envelope__flap" id="envelope-flap"></div>

      <!-- Side folds -->
      <div class="envelope__fold-left"></div>
      <div class="envelope__fold-right"></div>

      <!-- Bottom fold -->
      <div class="envelope__fold-bottom"></div>

      <!-- Gold wax seal with leaf -->
      <div class="envelope__seal" id="envelope-seal">
        <img src="img/wax-seal.jpg" alt="" class="envelope__seal-img" />
      </div>
    </div>

    <!-- "Tap to Open" hint -->
    <div class="envelope__cta" id="envelope-hint">
      <p class="envelope__cta-text">TAP TO OPEN</p>
      <div class="envelope__cta-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M12 5v14M5 12l7 7 7-7" />
        </svg>
      </div>
    </div>

    <!-- Scattered white petals -->
    <div class="envelope__petal envelope__petal--1" aria-hidden="true"></div>
    <div class="envelope__petal envelope__petal--2" aria-hidden="true"></div>
    <div class="envelope__petal envelope__petal--3" aria-hidden="true"></div>
  </div>

  <!-- ════════ "YOU ARE INVITED" INTERSTITIAL ════════ -->
  <div id="invited" class="invited" aria-hidden="true">
    <!-- Ornamental top flourish -->
    <svg class="invited__flourish invited__flourish--top" viewBox="0 0 200 60" fill="none" stroke="currentColor"
      stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
      <path pathLength="1" style="--d:0s; --dur:1.2s" d="M10 50 C 40 20, 80 10, 100 10 C 120 10, 160 20, 190 50" />
      <path pathLength="1" style="--d:0.4s" d="M60 30 C 55 22, 58 14, 66 12 C 68 20, 65 27, 60 30 Z" />
      <path pathLength="1" style="--d:0.6s" d="M140 30 C 145 22, 142 14, 134 12 C 132 20, 135 27, 140 30 Z" />
      <path pathLength="1" style="--d:0.8s" d="M100 10 C 100 2, 104 -2, 110 0 C 108 8, 104 12, 100 12 Z" />
      <path pathLength="1" style="--d:0.8s" d="M100 10 C 100 2, 96 -2, 90 0 C 92 8, 96 12, 100 12 Z" />
    </svg>

    <p class="invited__text" id="invited-text">You are invited!</p>

    <!-- Ornamental bottom flourish (mirrored) -->
    <svg class="invited__flourish invited__flourish--bottom" viewBox="0 0 200 60" fill="none" stroke="currentColor"
      stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
      <path pathLength="1" style="--d:0.3s; --dur:1.2s" d="M10 10 C 40 40, 80 50, 100 50 C 120 50, 160 40, 190 10" />
      <path pathLength="1" style="--d:0.7s" d="M60 30 C 55 38, 58 46, 66 48 C 68 40, 65 33, 60 30 Z" />
      <path pathLength="1" style="--d:0.9s" d="M140 30 C 145 38, 142 46, 134 48 C 132 40, 135 33, 140 30 Z" />
    </svg>
  </div>

  <!-- ════════ SITE ════════ -->
  <main id="site" class="site" hidden>

    <!-- BANNER -->
    <div class="top-banner">
      <span class="top-banner__icon">✨</span>
      <span>No kids allowed / ممنوع اصطحاب الأطفال</span>
      <span class="top-banner__icon">✨</span>
    </div>

    <!-- HERO -->
    <section class="hero" id="hero">
      <div class="hero__bg"></div>
      <div class="hero__particles"></div>

      <div class="hero__content glass-card reveal">
        <p class="hero__kicker script" id="hero-kicker"></p>
        <h1 class="hero__names serif">
          <span id="name-first"></span>
          <span class="amp serif-italic">&amp;</span>
          <span id="name-second"></span>
        </h1>
        <p class="hero__date label" id="hero-date"></p>
        <button class="btn btn--dark" id="hero-btn">
          <span id="hero-btn-text"></span>
          <span class="btn__arrow">→</span>
        </button>
      </div>

      <p class="hero__scroll label"><span id="hero-scroll-text"></span> ↓</p>
    </section>

    <!-- SAVE THE DATE -->
    <section class="std" id="save-the-date">
      <h2 class="std__title reveal">
        <span class="std__save">SAVE</span>
        <span class="std__the-date"><em class="script">the</em><span>DATE!</span></span>
      </h2>
      <!-- <img class="std__illustration reveal" id="std-illustration" src="" alt="Bride and groom illustration" /> -->
      <hr class="std__rule" />
      <p class="std__names label reveal" id="std-names"></p>
      <p class="std__date label reveal" id="std-date"></p>
    </section>

    <!-- VENUE -->
    <section class="venue" id="venue">
      <div class="venue__bg" id="venue-bg"></div>
      <div class="venue__content">
        <h2 class="venue__title serif reveal">
          <span id="venue-title-start"></span>
          <em class="serif-italic" id="venue-title-italic"></em>
          <span id="venue-title-end"></span>
        </h2>
        <dl class="venue__details">
          <div class="reveal">
            <dt class="label">Venue</dt>
            <dd class="serif" id="venue-name"></dd>
          </div>
          <div class="reveal">
            <dt class="label">When</dt>
            <dd class="serif" id="venue-when"></dd>
          </div>
          <div class="reveal">
            <dt class="label">Notice</dt>
            <dd class="serif" id="venue-dress"></dd>
          </div>
        </dl>
        <a class="btn btn--ghost reveal" id="venue-maps" href="#" target="_blank" rel="noopener">
          <span class="label">Open in Maps</span><span class="btn__arrow">↗</span>
        </a>
      </div>
    </section>

    <!-- PROGRAM -->
    <section class="program" id="program">
      <p class="program__kicker script reveal" id="program-kicker"></p>
      <h2 class="program__title serif reveal" id="program-title"></h2>
      <ol class="program__list" id="program-list"></ol>
      <p class="program__closing script reveal" id="program-closing"></p>
    </section>

    <!-- GALLERY -->
    <section class="gallery" id="gallery">
      <h2 class="gallery__title serif reveal" id="gallery-title"></h2>
      <p class="gallery__subtitle reveal" id="gallery-subtitle"></p>
      <div class="gallery__grid" id="gallery-grid"></div>
    </section>

    <!-- COUNTDOWN -->
    <section class="countdown" id="countdown">
      <h2 class="countdown__title serif reveal" id="countdown-title"></h2>
      <div class="countdown__grid">
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-days">0</span><span class="label"
            id="cd-days-label"></span></div>
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-hours">0</span><span class="label"
            id="cd-hours-label"></span></div>
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-minutes">0</span><span
            class="label" id="cd-minutes-label"></span></div>
        <div class="countdown__card reveal"><span class="countdown__num serif" id="cd-seconds">0</span><span
            class="label" id="cd-seconds-label"></span></div>
      </div>
      <p class="countdown__closing script reveal" id="countdown-closing"></p>
    </section>

    <!-- MESSAGE -->
    <section class="msg" id="message">
      <hr class="msg__rule" />
      <h2 class="msg__title serif reveal" id="msg-title"></h2>
      <p class="msg__text serif-italic reveal" id="msg-text"></p>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <p class="footer__names serif">
        <span id="footer-name-first"></span>
        <span class="amp serif-italic">&amp;</span>
        <span id="footer-name-second"></span>
      </p>
      <p class="footer__date label" id="footer-date"></p>
      <p class="footer__credit label">
        <span id="footer-credit-label"></span>
        <a id="footer-credit-name" href="#"></a>
      </p>
      <div class="footer__social" id="footer-social"></div>
    </footer>
  </main>

  <!-- MUSIC BUTTON -->
  <button id="music-btn" class="music-btn" hidden aria-label="Play / pause music">
    <svg class="music-btn__play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M8 5v14l11-7z" />
    </svg>
    <svg class="music-btn__pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="M6 5h4v14H6zM14 5h4v14h-4z" />
    </svg>
  </button>
  <audio id="music" loop preload="none"></audio>

  <script src="config.js"></script>
  <script src="js/main.js"></script>
</body>

</html>
