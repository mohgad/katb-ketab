<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة كتب كتاب | محمد وأسماء</title>
    <!-- خطوط عربية كلاسيكية من Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-navy: #0A192F;
            --gold: #D4AF37;
            --bg-color: #F8F5E6; /* لون ورق البردي أو الكريمي */
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Amiri', serif;
            background-color: var(--primary-navy);
            color: var(--gold);
            text-align: center;
            overflow-x: hidden;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background-image: url('andalusian-pattern-bg.png'); /* هنحط هنا باترن إسلامي شفاف */
            background-size: cover;
        }
        .hero-section {
            padding: 50px 0;
        }
        .names {
            font-family: 'Aref Ruqaa', serif;
            font-size: 3rem;
            margin: 20px 0;
        }
        .details-section {
            font-size: 1.2rem;
            line-height: 2;
            margin: 40px 0;
        }
        .mosque-image-container {
            margin: 40px auto;
            width: 80%;
            border: 3px solid var(--gold);
            border-radius: 150px 150px 0 0; /* شكل القوس الإسلامي */
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .mosque-image-container img {
            width: 100%;
            display: block;
            filter: sepia(40%) contrast(110%); /* عشان تليق مع الألوان الكلاسيكية */
        }
        /* قسم العداد التنازلي في الآخر خالص */
        .countdown-section {
            margin-top: 50px;
            padding: 30px 0;
            border-top: 1px solid var(--gold);
        }
        .timer-display {
            font-size: 2rem;
            direction: ltr; /* عشان الأرقام تظهر مظبوطة */
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- القسم الأول: المقدمة والأسماء -->
        <div class="hero-section">
            <h2>بسم الله الرحمن الرحيم</h2>
            <p>"وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُم مِّنْ أَنفُسِكُمْ أَزْوَاجًا لِّتَسْكُنُوا إِلَيْهَا..."</p>
            <div class="names">
                محمد <br> & <br> أسماء
            </div>
        </div>

        <!-- القسم الثاني: الموعد والمكان -->
        <div class="details-section">
            <p>نتشرف بدعوتكم لحضور عقد القران</p>
            <h3>يوم الجمعة ٤ سبتمبر ٢٠٢٦</h3>
            <p>في تمام الساعة ٨:٠٠ مساءً</p>
            <p><strong>بمسجد العلي العظيم - ألماظة</strong></p>
        </div>

        <!-- القسم الثالث: صورة المسجد -->
        <div class="mosque-image-container">
            <!-- استبدل الرابط بصورة المسجد الفعلية -->
            <img src="al-ali-al-azeem-mosque.jpg" alt="مسجد العلي العظيم">
        </div>

        <!-- القسم الأخير: العداد التنازلي -->
        <div class="countdown-section">
            <h3>متبقي على الفرحة</h3>
            <div class="timer-display" id="countdown">00:00:00:00</div>
        </div>
    </div>

    <!-- سكريبت العداد التنازلي -->
    <script>
        const targetDate = new Date("Sep 4, 2026 20:00:00").getTime();
        
        const countdownInterval = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("countdown").innerHTML = 
                `${days}d : ${hours}h : ${minutes}m : ${seconds}s`;

            if (distance < 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown").innerHTML = "مرحباً بكم!";
            }
        }, 1000);
    </script>
</body>
</html>
